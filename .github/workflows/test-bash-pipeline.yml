name: Test Bash RNA-seq Pipeline

on:
  push:
    branches: [ bash ]
  pull_request:
    branches: [ bash ]
  workflow_dispatch:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies and tools
      run: |
        sudo apt-get update
        sudo apt-get install -y wget default-jre fastqc samtools

        # Install STAR
        cd /tmp
        wget -q https://github.com/alexdobin/STAR/archive/2.7.10b.tar.gz
        tar -xzf 2.7.10b.tar.gz
        sudo cp STAR-2.7.10b/bin/Linux_x86_64/STAR /usr/local/bin/

        # Install subread (featureCounts)
        wget -q https://sourceforge.net/projects/subread/files/subread-2.0.3/subread-2.0.3-Linux-x86_64.tar.gz
        tar -xzf subread-2.0.3-Linux-x86_64.tar.gz
        sudo cp subread-2.0.3-Linux-x86_64/bin/featureCounts /usr/local/bin/

        # Verify installations
        fastqc --version
        STAR --version
        samtools --version
        featureCounts -v

    - name: Make pipeline script executable
      run: |
        chmod +x rnaseq_pipeline.sh

    - name: Create test data directories
      run: |
        mkdir -p test_data/reads
        mkdir -p test_data/reference

    - name: Download minimal test reads
      run: |
        cd test_data/reads
        # Use stable URLs from nf-core test-datasets repo
        wget -q "https://github.com/nf-core/test-datasets/raw/rnaseq/testdata/GSE110004/SRR6357070_1.fastq.gz" -O sample1_R1.fastq.gz
        wget -q "https://github.com/nf-core/test-datasets/raw/rnaseq/testdata/GSE110004/SRR6357070_2.fastq.gz" -O sample1_R2.fastq.gz

        # Verify downloads
        ls -lh
        gunzip -t sample1_R1.fastq.gz
        gunzip -t sample1_R2.fastq.gz

        echo "Downloaded $(zcat sample1_R1.fastq.gz | wc -l | awk '{print $1/4}') read pairs"

    - name: Download reference genome and annotation
      run: |
        cd test_data/reference
        # Download minimal reference files from nf-core test-datasets
        wget -q "https://github.com/nf-core/test-datasets/raw/rnaseq/reference/genome.fa" -O genome.fa
        wget -q "https://github.com/nf-core/test-datasets/raw/rnaseq/reference/genes.gtf.gz" -O genes.gtf.gz
        gunzip genes.gtf.gz
        mv genes.gtf annotation.gtf

        # Verify downloads
        ls -lh
        head -5 genome.fa
        head -5 annotation.gtf

    - name: Build STAR index
      run: |
        cd test_data/reference
        mkdir star_index

        STAR --runMode genomeGenerate \
          --genomeDir star_index \
          --genomeFastaFiles genome.fa \
          --sjdbGTFfile annotation.gtf \
          --sjdbOverhang 99 \
          --genomeSAindexNbases 10 \
          --runThreadN 2

        # Verify index
        ls -lh star_index/

        # Clean up genome file to save space
        rm genome.fa

    - name: Run Bash pipeline
      run: |
        ./rnaseq_pipeline.sh \
          --read1 test_data/reads/sample1_R1.fastq.gz \
          --read2 test_data/reads/sample1_R2.fastq.gz \
          --star-index test_data/reference/star_index \
          --annotation test_data/reference/annotation.gtf \
          --sample-name sample1 \
          --output-dir results \
          --threads 2

    - name: Verify outputs
      run: |
        echo "=== Checking pipeline outputs ==="

        # Check FastQC outputs
        echo "FastQC reports:"
        ls -lh results/fastqc/

        # Check STAR outputs
        echo "STAR alignment:"
        ls -lh results/star/

        # Check featureCounts outputs
        echo "Gene counts:"
        ls -lh results/counts/

        # Verify key files exist
        test -f results/fastqc/sample1_R1_fastqc.html || exit 1
        test -f results/fastqc/sample1_R2_fastqc.html || exit 1
        test -f results/star/sample1.Aligned.sortedByCoord.out.bam || exit 1
        test -f results/star/sample1.Aligned.sortedByCoord.out.bam.bai || exit 1
        test -f results/star/sample1.Log.final.out || exit 1
        test -f results/counts/sample1.counts.txt || exit 1

        # Show some statistics
        echo "=== STAR alignment statistics ==="
        cat results/star/sample1.Log.final.out

        echo "=== featureCounts summary ==="
        cat results/counts/sample1.counts.txt.summary

        echo "=== Sample of counts file ==="
        head -20 results/counts/sample1.counts.txt

        echo "=== Pipeline test completed successfully ==="

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bash-pipeline-results
        path: |
          results/
          !results/**/*.bam
        retention-days: 7
